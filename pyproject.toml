[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "adenosine-selectivity-model"
version = "2.0.0"
description = "Publication-grade QSAR platform for adenosine receptor binding affinity and selectivity prediction"
authors = [{ name = "Utkarsh Patel" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=1.5",
    "scikit-learn>=1.3",
    "xgboost>=1.7",
    "rdkit>=2023.3",
    "plotly>=5.15",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "streamlit>=1.28",
    "joblib>=1.3",
    "py3Dmol>=2.0",
    "mapie>=1.4.0",
    "shap>=0.44",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "mlflow>=2.8",
    "optuna>=3.3",
]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["src*"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "BLE"]
ignore = ["E501", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unreachable = false
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests that require trained models or data files",
]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "unwanted*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
